name: Add Databases and Services Hotbar Icons
on:
  push:
    paths:
      - ".github/workflows/techstack-phase4.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Add centered phase-four icons without changing anything else
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageChops, ImageColor
          import subprocess
          from pathlib import Path
          from collections import Counter
          
          path = Path("assets/techstack-level-loop.gif")
          expected_sha = "ce072d1c73da3b3bcd2164c802140dcf08b8a729"
          actual_sha = subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          assert actual_sha == expected_sha, f"Unexpected existing GIF SHA: {actual_sha}"
          gif = Image.open(path)
          assert gif.size == (1068, 368) and gif.n_frames == 45, "Unexpected GIF baseline; refusing to alter."
          original = []
          durations = []
          for i in range(gif.n_frames):
              gif.seek(i)
              original.append(gif.convert("RGB").copy())
              durations.append(gif.info.get("duration", 600))
          assert all(ms == 600 for ms in durations), "Unexpected timing; refusing to alter."
          
          # Verified slot interiors: x=186..241, 266..325, ... 826..885.
          # A 44px icon centered at x=214 + 80*i, y=282 clears all
          # regular slot dividers AND the larger animated selection border.
          centers = [(214 + 80 * i, 282) for i in range(9)]
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def tile():
              return Image.new("RGBA", (22, 22), (0, 0, 0, 0))
          def txt(icon, text, size=12, fill="white", offset=(0, 0)):
              d = ImageDraw.Draw(icon)
              font = ImageFont.truetype(font_path, size)
              bbox = d.textbbox((0, 0), text, font=font)
              x = (22 - (bbox[2] - bbox[0])) // 2 - bbox[0] + offset[0]
              y = (22 - (bbox[3] - bbox[1])) // 2 - bbox[1] + offset[1]
              mask = Image.new("L", (22,22))
              ImageDraw.Draw(mask).text((x,y), text, font=font, fill=255)
              mask = mask.point(lambda v: 255 if v >= 128 else 0)
              icon.paste(ImageColor.getrgb(fill) + (255,), (0,0,22,22), mask)
          def icon_for(lang):
              im = tile()
              d = ImageDraw.Draw(im)
              if lang == "SQLite":
                  # Blue SQLite database and white feather.
                  d.rounded_rectangle((2,3,18,20),radius=2,fill="#2369a3")
                  d.ellipse((2,1,18,7),fill="#75b5dc")
                  d.arc((2,9,18,14),0,180,fill="#b9dcf2",width=1)
                  d.arc((2,14,18,19),0,180,fill="#b9dcf2",width=1)
                  d.polygon([(12,15),(14,6),(20,1),(19,10)],fill="#ffffff")
                  d.line([(11,19),(18,5)],fill="#b9dcf2",width=1)
              elif lang == "MySQL":
                  # MySQL's blue dolphin silhouette above an orange underline.
                  blue="#4c93b0"
                  d.ellipse((6,4,17,11),fill=blue)
                  d.polygon([(4,7),(9,4),(14,3),(19,6),(20,10),(15,9),
                             (11,13),(8,16),(7,11)],fill=blue)
                  d.polygon([(5,9),(1,7),(3,13),(7,12)],fill=blue)
                  d.point((15,6),fill="#ffffff")
                  d.arc((2,11,20,21),0,160,fill="#f29111",width=2)
              elif lang == "PostgreSQL":
                  # Stylized blue elephant: two ears, eyes, curled trunk.
                  blue="#3975a4"
                  d.ellipse((3,3,11,15),fill=blue)
                  d.ellipse((11,3,19,15),fill=blue)
                  d.rounded_rectangle((7,5,17,16),radius=4,fill="#3975a4")
                  d.line([(15,10),(15,18),(11,19),(9,17)],fill="#3975a4",width=4)
                  d.point((9,8),fill="#ffffff")
                  d.point((16,8),fill="#ffffff")
                  d.point((9,8),fill="#1d3552")
                  d.point((16,8),fill="#1d3552")
                  d.line([(3,14),(8,16)],fill="#bedbed",width=2)
              elif lang == "Prisma ORM":
                  # Prisma's triangular prism with pale inner face.
                  d.polygon([(10,1),(20,18),(3,21)],fill="#172c46")
                  d.polygon([(10,4),(17,16),(7,18)],fill="#a8d6df")
                  d.polygon([(10,4),(12,15),(7,18)],fill="#ffffff")
              elif lang == "Supabase":
                  # Supabase green two-part lightning mark.
                  d.polygon([(13,1),(4,12),(10,12),(9,21),(20,9),(14,9)],
                            fill="#3ecf8e")
                  d.polygon([(13,1),(12,9),(14,9),(20,9)],fill="#8ff5b6")
              elif lang == "Firebase":
                  # Firebase's orange/yellow flame made of three facets.
                  d.polygon([(3,17),(7,5),(10,10),(14,1),(20,16),(11,21)],
                            fill="#f5a623")
                  d.polygon([(3,17),(7,5),(10,10),(11,21)],fill="#ffa000")
                  d.polygon([(10,10),(14,1),(20,16),(11,21)],fill="#ffca28")
                  d.polygon([(11,21),(15,12),(20,16)],fill="#f57c00")
              elif lang == "Redis":
                  # Redis signature stacked red cache/database slabs.
                  for dx,dy in [(0,6),(0,3),(0,0)]:
                      d.polygon([(2,10+dy),(11,6+dy),(20,10+dy),
                                 (11,14+dy)],fill="#d82c20")
                      d.line([(2,11+dy),(11,15+dy),(20,11+dy)],
                             fill="#8a1916",width=1)
                  d.polygon([(7,10),(11,8),(15,10),(11,12)],fill="#ffffff")
              elif lang == "MongoDB":
                  # MongoDB's single green leaf, central light vein.
                  d.polygon([(11,1),(6,7),(5,14),(8,19),(11,21),(14,19),
                             (17,14),(16,7)],fill="#47a248")
                  d.polygon([(11,1),(11,20),(14,19),(17,14),(16,7)],
                            fill="#68c96c")
                  d.line([(11,5),(11,20)],fill="#f5e6b4",width=1)
              elif lang == "Google Cloud":
                  # Four-color pixel cloud.
                  d.arc((4,4,14,15),125,255,fill="#4285f4",width=4)
                  d.arc((8,2,21,15),200,327,fill="#ea4335",width=4)
                  d.arc((9,5,22,19),300,65,fill="#fbbc05",width=4)
                  d.line([(17,17),(11,17)],fill="#34a853",width=4)
                  d.line([(11,17),(5,17)],fill="#4285f4",width=4)
              return im.resize((44,44),Image.Resampling.NEAREST)

          langs = ["SQLite","MySQL","PostgreSQL","Prisma ORM","Supabase","Firebase","Redis","MongoDB","Google Cloud"]
          icons = [icon_for(name) for name in langs]
          # Keep ALL 99 original RGB colors exactly. Add only icon colors; do
          # not allow GIF quantization to repaint any pixel outside the icons.
          palette_colors = set()
          for frame in original:
              palette_colors.update(color for count, color in frame.getcolors(1068*368))
          for icon in icons:
              palette_colors.update((r,g,b) for r,g,b,a in icon.getdata() if a)
          assert len(palette_colors) <= 256, f"Need {len(palette_colors)} colors; exact color preservation unavailable"
          colors = sorted(palette_colors)
          lut = {c: i for i,c in enumerate(colors)}
          rgb_palette = [n for c in colors for n in c] + [0] * (768 - len(colors)*3)
          
          out = []
          for frame_index, old in enumerate(original):
              canvas = old.copy()
              if 27 <= frame_index < 36:  # ONLY level 30: databases and services.
                  for (cx, cy), ico in zip(centers, icons):
                      canvas.paste(ico, (cx-22, cy-22), ico)
              indexed = Image.new("P", gif.size)
              indexed.putpalette(rgb_palette)
              indexed.putdata([lut[pixel] for pixel in canvas.getdata()])
              out.append(indexed)
          
          tmp = path.with_name("techstack-level-loop-databases-icons.tmp.gif")
          out[0].save(tmp, save_all=True, append_images=out[1:], duration=durations,
                      loop=gif.info.get("loop", 0), disposal=2, optimize=False)
          
          # Re-decode final GIF and prove no existing animation, HUD border,
          # background, digits, or later technology phase was repainted.
          check = Image.open(tmp)
          assert check.size == gif.size and check.n_frames == 45
          for i, old in enumerate(original):
              check.seek(i)
              assert check.info.get("duration") == durations[i], f"Timing changed in frame {i}"
              diff = ImageChops.difference(old, check.convert("RGB"))
              if 27 <= i < 36:
                  d = ImageDraw.Draw(diff)
                  for cx,cy in centers:
                      d.rectangle((cx-22,cy-22,cx+21,cy+21), fill=(0,0,0))
              assert diff.getbbox() is None, f"Unrequested pixels changed in frame {i}"
          tmp.replace(path)
          print("PASS: 9 centered database/service pixel-art icons in frames 27-35 (level 30) only.")
          print("PASS: all 45 frames, 600ms timing and every pixel outside level 30 icon boxes unchanged.")
          print("Palette colors:",len(colors),"File bytes:",path.stat().st_size)
          PY
      - name: Commit only techstack GIF
        run: |
          git add -- assets/techstack-level-loop.gif
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(profile): add database and service icons to techstack hotbar"
          git push

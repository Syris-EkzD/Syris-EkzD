name: Render Stardew Intro

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_dialogue_intro.py"
      - "assets/dialogue-typewriter-base.gif"
      - "assets/sdv-intro-background.png"
      - ".github/workflows/stardew-intro.yml"

permissions:
  contents: write

jobs:
  render-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install Pillow==11.3.0

      - name: Composite Stardew background behind intro dialogue
        run: python scripts/build_dialogue_intro.py

      - name: Commit only the rendered intro
        run: |
          git add -- assets/dialogue-typewriter.gif
          if git diff --cached --quiet; then
            echo "Stardew intro is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh Stardew intro background"
          git push

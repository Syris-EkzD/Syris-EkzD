name: Add Programming Language Hotbar Icons
on:
  push:
    paths:
      - ".github/workflows/techstack-inspect.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Add centered programming language icons without changing anything else
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageChops
          from pathlib import Path
          from collections import Counter
          
          path = Path("assets/techstack-level-loop.gif")
          gif = Image.open(path)
          assert gif.size == (1068, 368) and gif.n_frames == 45, "Unexpected GIF baseline; refusing to alter."
          original = []
          durations = []
          for i in range(gif.n_frames):
              gif.seek(i)
              original.append(gif.convert("RGB").copy())
              durations.append(gif.info.get("duration", 600))
          assert all(ms == 600 for ms in durations), "Unexpected timing; refusing to alter."
          
          # Verified slot interiors: x=186..241, 266..325, ... 826..885.
          # A 44px icon centered at x=214 + 80*i, y=282 clears all
          # regular slot dividers AND the larger animated selection border.
          centers = [(214 + 80 * i, 282) for i in range(9)]
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def tile():
              return Image.new("RGBA", (22, 22), (0, 0, 0, 0))
          def txt(icon, text, size=12, fill="white", offset=(0, 0)):
              d = ImageDraw.Draw(icon)
              font = ImageFont.truetype(font_path, size)
              bbox = d.textbbox((0, 0), text, font=font)
              x = (22 - (bbox[2] - bbox[0])) // 2 - bbox[0] + offset[0]
              y = (22 - (bbox[3] - bbox[1])) // 2 - bbox[1] + offset[1]
              d.text((x, y), text, font=font, fill=fill)
          def icon_for(lang):
              im = tile(); d = ImageDraw.Draw(im)
              if lang == "C":
                  d.ellipse((1, 1, 20, 20), fill="#245997")
                  txt(im, "C", 15)
              elif lang == "C#":
                  d.polygon([(6,1),(16,1),(21,6),(21,16),(16,21),(6,21),(1,16),(1,6)], fill="#762cbf")
                  txt(im, "C#", 9)
              elif lang == "C++":
                  d.polygon([(6,1),(16,1),(21,6),(21,16),(16,21),(6,21),(1,16),(1,6)], fill="#205caa")
                  txt(im, "C++", 8)
              elif lang == "Python":
                  d.rounded_rectangle((2,2,15,11), radius=3, fill="#3676a8")
                  d.rectangle((11,8,18,11), fill="#3676a8")
                  d.rectangle((3,10,8,12), fill="#3676a8")
                  d.rounded_rectangle((7,10,20,19), radius=3, fill="#ffd343")
                  d.rectangle((4,10,11,13), fill="#ffd343")
                  d.point((6,5), fill="#ffffff")
                  d.point((16,16), fill="#3b3200")
              elif lang == "JavaScript":
                  d.rectangle((1,1,20,20), fill="#f7df1e")
                  txt(im, "JS", 11, "#252525", (1,2))
              elif lang == "TypeScript":
                  d.rectangle((1,1,20,20), fill="#3178c6")
                  txt(im, "TS", 11, "#ffffff", (1,2))
              elif lang == "Dart":
                  d.polygon([(3,3),(13,1),(21,9),(19,19),(9,21),(1,13)], fill="#00b4ab")
                  d.polygon([(4,4),(14,4),(19,9),(19,17),(9,17),(4,12)], fill="#40c4f3")
                  d.line([(4,4),(9,9),(19,9)], fill="#e7ffff", width=2)
                  d.line([(9,9),(9,17)], fill="#0076a8", width=2)
              elif lang == "Kotlin":
                  d.rectangle((1,1,20,20), fill="#7548d9")
                  d.polygon([(1,1),(20,1),(1,20)], fill="#e45683")
                  d.polygon([(1,20),(20,1),(20,20)], fill="#7f52ff")
                  d.polygon([(1,20),(11,10),(20,20)], fill="#f38a36")
              elif lang == "Java":
                  d.arc((3,12,18,19), 0, 180, fill="#8cbbda", width=2)
                  d.line([(5,12),(17,12),(15,16),(8,16),(5,12)], fill="#f4f4ed", width=2)
                  d.arc((14,11,21,17), 270, 90, fill="#f4f4ed", width=2)
                  d.arc((7,3,13,12), 50, 215, fill="#ed6d31", width=2)
                  d.arc((11,1,17,10), 50, 215, fill="#e88945", width=2)
                  d.line([(4,19),(19,19)], fill="#8cbbda", width=2)
              return im.resize((44, 44), Image.Resampling.NEAREST)
          
          langs = ["C", "C#", "C++", "Python", "JavaScript", "TypeScript", "Dart", "Kotlin", "Java"]
          icons = [icon_for(name) for name in langs]
          # Keep ALL 99 original RGB colors exactly. Add only icon colors; do
          # not allow GIF quantization to repaint any pixel outside the icons.
          palette_colors = set()
          for frame in original:
              palette_colors.update(color for count, color in frame.getcolors(1068*368))
          for icon in icons:
              palette_colors.update((r,g,b) for r,g,b,a in icon.getdata() if a)
          assert len(palette_colors) <= 256, f"Need {len(palette_colors)} colors; exact color preservation unavailable"
          colors = sorted(palette_colors)
          lut = {c: i for i,c in enumerate(colors)}
          rgb_palette = [n for c in colors for n in c] + [0] * (768 - len(colors)*3)
          
          out = []
          for frame_index, old in enumerate(original):
              canvas = old.copy()
              if frame_index < 9:  # ONLY level 0: programming languages.
                  for (cx, cy), ico in zip(centers, icons):
                      canvas.paste(ico, (cx-22, cy-22), ico)
              indexed = Image.new("P", gif.size)
              indexed.putpalette(rgb_palette)
              indexed.putdata([lut[pixel] for pixel in canvas.getdata()])
              out.append(indexed)
          
          tmp = path.with_name("techstack-level-loop-language-icons.tmp.gif")
          out[0].save(tmp, save_all=True, append_images=out[1:], duration=durations,
                      loop=gif.info.get("loop", 0), disposal=2, optimize=False)
          
          # Re-decode final GIF and prove no existing animation, HUD border,
          # background, digits, or later technology phase was repainted.
          check = Image.open(tmp)
          assert check.size == gif.size and check.n_frames == 45
          for i, old in enumerate(original):
              check.seek(i)
              assert check.info.get("duration") == durations[i], f"Timing changed in frame {i}"
              diff = ImageChops.difference(old, check.convert("RGB"))
              if i < 9:
                  d = ImageDraw.Draw(diff)
                  for cx,cy in centers:
                      d.rectangle((cx-22,cy-22,cx+21,cy+21), fill=(0,0,0))
              assert diff.getbbox() is None, f"Unrequested pixels changed in frame {i}"
          tmp.replace(path)
          print("PASS: 9 centered pixel-art language icons in frames 0-8 only.")
          print("PASS: all 45 frames, 600ms timing and every pixel outside icon boxes unchanged.")
          print("Palette colors:",len(colors),"File bytes:",path.stat().st_size)
          PY
      - name: Commit only techstack GIF
        run: |
          git add -- assets/techstack-level-loop.gif
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(profile): add programming language icons to techstack hotbar"
          git push

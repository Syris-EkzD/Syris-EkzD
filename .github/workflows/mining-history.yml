name: Update Mining History

# Retained for manual regeneration of the archived Mining History asset.
# Commit City is now the daily-updated activity visualization.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mining-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0

      - name: Render animated Minecraft contribution mine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/mining_history.py

      - name: Commit only the animated mining wall
        run: |
          git add -- assets/mining-history.gif
          if git diff --cached --quiet; then
            echo "Contribution wall is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh mining history"
          git push

name: Add Development Tools Hotbar Icons
on:
  push:
    paths:
      - ".github/workflows/techstack-phase5.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Add centered phase-five icons without changing anything else
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageChops, ImageColor
          import subprocess
          from pathlib import Path
          from collections import Counter
          
          path = Path("assets/techstack-level-loop.gif")
          expected_sha = "35ce5a32591e9d33a15e54d2ae91b50b274ed3b1"
          actual_sha = subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          assert actual_sha == expected_sha, f"Unexpected existing GIF SHA: {actual_sha}"
          gif = Image.open(path)
          assert gif.size == (1068, 368) and gif.n_frames == 45, "Unexpected GIF baseline; refusing to alter."
          original = []
          durations = []
          for i in range(gif.n_frames):
              gif.seek(i)
              original.append(gif.convert("RGB").copy())
              durations.append(gif.info.get("duration", 600))
          assert all(ms == 600 for ms in durations), "Unexpected timing; refusing to alter."
          
          # Verified slot interiors: x=186..241, 266..325, ... 826..885.
          # A 44px icon centered at x=214 + 80*i, y=282 clears all
          # regular slot dividers AND the larger animated selection border.
          centers = [(214 + 80 * i, 282) for i in range(9)]
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def tile():
              return Image.new("RGBA", (22, 22), (0, 0, 0, 0))
          def txt(icon, text, size=12, fill="white", offset=(0, 0)):
              d = ImageDraw.Draw(icon)
              font = ImageFont.truetype(font_path, size)
              bbox = d.textbbox((0, 0), text, font=font)
              x = (22 - (bbox[2] - bbox[0])) // 2 - bbox[0] + offset[0]
              y = (22 - (bbox[3] - bbox[1])) // 2 - bbox[1] + offset[1]
              mask = Image.new("L", (22,22))
              ImageDraw.Draw(mask).text((x,y), text, font=font, fill=255)
              mask = mask.point(lambda v: 255 if v >= 128 else 0)
              icon.paste(ImageColor.getrgb(fill) + (255,), (0,0,22,22), mask)
          def icon_for(lang):
              im = tile()
              d = ImageDraw.Draw(im)
              if lang == "VS Code":
                  # Distinct blue VS Code folded ribbon.
                  d.polygon([(2,8),(5,5),(10,10),(18,2),(21,4),(21,18),
                             (18,20),(10,12),(5,17),(2,14),(7,11)],
                             fill="#007acc")
                  d.polygon([(10,10),(18,3),(18,19),(10,12)],fill="#29a9ef")
                  d.polygon([(3,8),(5,6),(11,11),(5,16),(3,14),(8,11)],
                             fill="#ffffff")
              elif lang == "npm":
                  # npm's horizontal red square-wordmark silhouette.
                  d.rectangle((1,6,21,16),fill="#cb3837")
                  d.rectangle((3,8,19,14),fill="#ffffff")
                  txt(im,"npm",7,"#cb3837")
              elif lang == "Git":
                  # Orange git diamond with a branching node path.
                  d.polygon([(11,1),(21,11),(11,21),(1,11)],fill="#f05032")
                  d.line([(7,7),(14,14),(14,18)],fill="#ffffff",width=2)
                  d.line([(10,10),(14,6)],fill="#ffffff",width=2)
                  for x,y in [(7,7),(10,10),(14,6),(14,14),(14,18)]:
                      d.ellipse((x-1,y-1,x+1,y+1),fill="#ffffff")
              elif lang == "GitHub":
                  # Pixel cat silhouette on an uncluttered dark disk.
                  d.ellipse((1,1,20,20),fill="#25292e")
                  d.polygon([(5,9),(4,4),(8,6),(14,6),(18,4),
                             (17,9),(17,15),(14,18),(8,18),(5,15)],
                            fill="#ffffff")
                  d.ellipse((7,9,15,16),fill="#ffffff")
                  d.rectangle((8,16,10,20),fill="#ffffff")
                  d.rectangle((13,16,15,20),fill="#ffffff")
              elif lang == "Linux (Tux)":
                  # Tux: black penguin, white belly, yellow beak and feet.
                  d.ellipse((5,1,17,18),fill="#1b1b1b")
                  d.ellipse((4,11,18,20),fill="#1b1b1b")
                  d.ellipse((7,8,15,19),fill="#f6f6e9")
                  d.ellipse((7,4,10,7),fill="#ffffff")
                  d.ellipse((12,4,15,7),fill="#ffffff")
                  d.point((9,6),fill="#1b1b1b")
                  d.point((13,6),fill="#1b1b1b")
                  d.polygon([(9,8),(13,8),(11,11)],fill="#f3ad20")
                  d.ellipse((2,17,10,21),fill="#f3ad20")
                  d.ellipse((12,17,20,21),fill="#f3ad20")
                  d.line([(5,13),(3,17)],fill="#1b1b1b",width=2)
                  d.line([(17,13),(19,17)],fill="#1b1b1b",width=2)
              elif lang == "Bash":
                  # Familiar dark terminal tile with >_ prompt.
                  d.rounded_rectangle((1,2,20,19),radius=2,fill="#31363b")
                  d.rectangle((2,3,19,6),fill="#6a8c91")
                  d.line([(4,9),(9,12),(4,15)],fill="#e4f5f0",width=2)
                  d.line([(11,16),(17,16)],fill="#b6ff9e",width=2)
              elif lang == "Postman":
                  # Postman's orange circular badge and sending pointer.
                  d.ellipse((1,1,20,20),fill="#ff6c37")
                  d.line([(5,17),(16,6)],fill="#ffffff",width=2)
                  d.polygon([(12,5),(19,3),(17,10)],fill="#ffffff")
                  d.ellipse((3,15,8,20),fill="#ffffff")
                  d.line([(7,16),(16,7)],fill="#ff6c37",width=1)
              elif lang == "Docker":
                  # Docker's whale carrying container blocks.
                  blue="#2496ed"
                  for x,y in [(3,7),(8,7),(13,7),(3,12),(8,12),(13,12),
                              (13,2)]:
                      d.rectangle((x,y,x+3,y+3),fill=blue)
                  d.polygon([(2,16),(20,16),(17,19),(12,21),(6,20)],
                            fill=blue)
                  d.polygon([(17,13),(20,10),(21,14),(18,16)],fill=blue)
                  d.point((16,17),fill="#ffffff")
              elif lang == "GitHub Actions":
                  # White workflow/branch glyph on an Actions blue tile.
                  d.rounded_rectangle((1,1,20,20),radius=3,fill="#2088ff")
                  d.line([(5,6),(10,6),(10,16),(17,16)],fill="#ffffff",width=2)
                  d.line([(10,11),(17,6)],fill="#ffffff",width=2)
                  d.polygon([(14,4),(19,6),(14,8)],fill="#ffffff")
                  for x,y in [(5,6),(10,16),(17,16)]:
                      d.ellipse((x-1,y-1,x+1,y+1),fill="#ffffff")
              return im.resize((44,44),Image.Resampling.NEAREST)

          langs = ["VS Code","npm","Git","GitHub","Linux (Tux)","Bash",
                   "Postman","Docker","GitHub Actions"]
          icons = [icon_for(name) for name in langs]
          # Keep ALL 99 original RGB colors exactly. Add only icon colors; do
          # not allow GIF quantization to repaint any pixel outside the icons.
          palette_colors = set()
          for frame in original:
              palette_colors.update(color for count, color in frame.getcolors(1068*368))
          for icon in icons:
              palette_colors.update((r,g,b) for r,g,b,a in icon.getdata() if a)
          assert len(palette_colors) <= 256, f"Need {len(palette_colors)} colors; exact color preservation unavailable"
          colors = sorted(palette_colors)
          lut = {c: i for i,c in enumerate(colors)}
          rgb_palette = [n for c in colors for n in c] + [0] * (768 - len(colors)*3)
          
          out = []
          for frame_index, old in enumerate(original):
              canvas = old.copy()
              if 36 <= frame_index < 45:  # ONLY level 40: development tools.
                  for (cx, cy), ico in zip(centers, icons):
                      canvas.paste(ico, (cx-22, cy-22), ico)
              indexed = Image.new("P", gif.size)
              indexed.putpalette(rgb_palette)
              indexed.putdata([lut[pixel] for pixel in canvas.getdata()])
              out.append(indexed)
          
          tmp = path.with_name("techstack-level-loop-devtools-icons.tmp.gif")
          out[0].save(tmp, save_all=True, append_images=out[1:], duration=durations,
                      loop=gif.info.get("loop", 0), disposal=2, optimize=False)
          
          # Re-decode final GIF and prove no existing animation, HUD border,
          # background, digits, or later technology phase was repainted.
          check = Image.open(tmp)
          assert check.size == gif.size and check.n_frames == 45
          for i, old in enumerate(original):
              check.seek(i)
              assert check.info.get("duration") == durations[i], f"Timing changed in frame {i}"
              diff = ImageChops.difference(old, check.convert("RGB"))
              if 36 <= i < 45:
                  d = ImageDraw.Draw(diff)
                  for cx,cy in centers:
                      d.rectangle((cx-22,cy-22,cx+21,cy+21), fill=(0,0,0))
              assert diff.getbbox() is None, f"Unrequested pixels changed in frame {i}"
          tmp.replace(path)
          print("PASS: 9 centered development-tool pixel-art icons in frames 36-44 (level 40) only.")
          print("PASS: all 45 frames, 600ms timing and every pixel outside level 40 icon boxes unchanged.")
          print("Palette colors:",len(colors),"File bytes:",path.stat().st_size)
          PY
      - name: Commit only techstack GIF
        run: |
          git add -- assets/techstack-level-loop.gif
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(profile): add development tools to techstack hotbar"
          git push

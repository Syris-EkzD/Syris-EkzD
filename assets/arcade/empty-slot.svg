<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Empty game cover slot</title>
  <desc id="desc">Square, dark pixel-arcade card with an understated plus icon; replace with a game thumbnail and link.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18272b"/><stop offset="1" stop-color="#0e171d"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="2" height="2" fill="#8dbfae" opacity=".15"/>
    </pattern>
  </defs>
  <rect x="7" y="7" width="206" height="206" rx="6" fill="url(#tile)" stroke="#5c8175" stroke-width="3"/>
  <rect x="17" y="17" width="186" height="186" rx="2" fill="url(#dots)" stroke="#294b46" stroke-width="2"/>
  <path d="M23 49V23H49 M171 23H197V49 M23 171V197H49 M171 197H197V171" fill="none" stroke="#98d0b7" stroke-width="3"/>
  <path d="M110 74V128 M83 101H137" fill="none" stroke="#a5ddc1" stroke-width="6" stroke-linecap="square" opacity=".85"/>
  <text x="110" y="166" text-anchor="middle" fill="#91bca8" font-family="DejaVu Sans Mono, monospace" font-size="11" letter-spacing="1.8">GAME SLOT</text>
</svg>

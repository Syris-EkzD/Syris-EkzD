<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
<title id="title">The Shire — cozy tavern sign</title>
<desc id="desc">An original cozy fantasy tavern sign in walnut wood, moss green, brass and warm lantern light, with vines framing The Shire.</desc>

<g stroke="#77956b" stroke-width="2" fill="none" stroke-linecap="round"><path d="M84 99Q110 73 137 100"/></g>
<g fill="#98b183">
<ellipse cx="93" cy="87" rx="6" ry="12" transform="rotate(-45 93 87)"/>
<ellipse cx="104" cy="80" rx="5" ry="10" transform="rotate(23 104 80)"/>
<ellipse cx="128" cy="89" rx="6" ry="11" transform="rotate(44 128 89)"/>
</g>
<path d="M99 111H121 M110 100V122" stroke="#ccbb96" stroke-width="3.5" stroke-linecap="round"/>

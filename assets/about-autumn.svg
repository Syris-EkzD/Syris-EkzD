<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="About EkzD. BSIT student based in Bohol, Philippines. Builds useful full-stack and offline-first apps, academic automation, and developer tools. Enjoys reading, gaming and tinkering with Linux.">

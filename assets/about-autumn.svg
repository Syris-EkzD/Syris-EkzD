<text x="58" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#EAB47D" >01  /  ABOUT ME</text>
<text x="60" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#FFF0D9" >Hello from Bohol, Philippines.</text>
<text x="60" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#F5E5CC" >I'm a BSIT student who likes making</text>
<text x="60" y="219" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#F5E5CC" >software that solves real problems.</text>
<text x="60" y="265" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#DFC4A8" >From offline-first task apps and school</text>
<text x="60" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#DFC4A8" >automation to full-stack web projects</text>
<text x="60" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#DFC4A8" >and developer tools, I enjoy figuring out</text>
<text x="60" y="373" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#DFC4A8" >how the whole system fits together.</text>
<rect x="55" y="404" width="850" height="2" fill="#77553F" />
<text x="60" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#EAB47D" >AFK:</text>
<text x="145" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#F5E5CC" >reading  /  gaming  /  tinkering with Linux</text>
<text x="60" y="487" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#EAB47D" >GOOD AT:</text>
<text x="179" y="487" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#DCC0A0" >turning small annoyances into side projects</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">WhiteTree Activity Core</title>
  <desc id="desc">A long WhiteTree trunk grows into a bushy contribution canopy. The canopy highlights total contributions, the 2026 branch contains active-day twigs, and an animated orb travels to the latest rendered activity.</desc>
  <defs>
    <style><![CDATA[
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}.title{font-size:30px;font-weight:800;letter-spacing:1.5px}.sub{font-size:12px;letter-spacing:2px}.year{font-size:12px;font-weight:800;letter-spacing:1px}.root-title{font-size:14px;font-weight:800;letter-spacing:1.4px}.root-sub{font-size:10px}.stat-label{font-size:10px;font-weight:700;letter-spacing:1.2px}.stat-value{font-size:22px;font-weight:800}.canopy-label{font-size:11px;font-weight:800;letter-spacing:2px}.canopy-value{font-size:50px;font-weight:900}.tiny{font-size:9px;letter-spacing:.6px}.day{fill:none;stroke:#b8c4cf;stroke-width:1.5;stroke-linecap:round}.bud1{fill:#53677b}.bud2{fill:#7393a5}.bud3{fill:#91bdc5}.bud4{fill:#b8e1d1}.bud5{fill:#f3f7fa}
    ]]></style>
    <filter id="glow" x="-220%" y="-220%" width="440%" height="440%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6e7f93"/><stop offset=".6" stop-color="#c7d0da"/><stop offset="1" stop-color="#f5f8fb"/></linearGradient>
    <path id="orbPath" d="M620 548 C618 500 620 450 620 392 Q760 282 947 292 L961 276"/>
  </defs>
  <rect width="1240" height="760" rx="18" fill="#11151d"/><rect x="10" y="10" width="1220" height="740" rx="14" fill="none" stroke="#2b3442" stroke-width="2"/>
  <text x="40" y="50" class="mono title" fill="#f1f5f9">WHITETREE // ACTIVITY CORE</text>
  <text x="42" y="75" class="mono sub" fill="#718096">YEAR → BRANCH   ACTIVE DAY → TWIG   ORB → LATEST CONTRIBUTION</text>

  <g opacity=".94">
    <ellipse cx="620" cy="244" rx="255" ry="144" fill="#183329" stroke="#2f5748"/><ellipse cx="445" cy="238" rx="178" ry="116" fill="#183329" stroke="#2f5748"/>
    <ellipse cx="795" cy="235" rx="183" ry="118" fill="#183329" stroke="#2f5748"/><ellipse cx="326" cy="272" rx="135" ry="92" fill="#183329" stroke="#2f5748"/>
    <ellipse cx="916" cy="268" rx="140" ry="95" fill="#183329" stroke="#2f5748"/><ellipse cx="512" cy="165" rx="145" ry="96" fill="#183329" stroke="#2f5748"/>
    <ellipse cx="715" cy="165" rx="145" ry="96" fill="#183329" stroke="#2f5748"/><ellipse cx="418" cy="323" rx="155" ry="92" fill="#183329" stroke="#2f5748"/>
    <ellipse cx="830" cy="322" rx="158" ry="94" fill="#183329" stroke="#2f5748"/><ellipse cx="620" cy="330" rx="210" ry="96" fill="#183329" stroke="#2f5748"/>
  </g>

  <path d="M620 548 C616 500 620 450 620 408 C620 382 620 360 620 340" fill="none" stroke="url(#trunk)" stroke-width="22" stroke-linecap="round"/>
  <path d="M620 392 Q760 282 968 292" fill="none" stroke="#d9e0e8" stroke-width="5" stroke-linecap="round"/>
  <text x="986" y="287" class="mono year" fill="#8998a8">2026</text>

  <g class="day">
    <path d="M714 333 l-5 -18"/><path d="M744 320 l8 17"/><path d="M771 310 l-7 -20"/><path d="M800 302 l9 18"/>
    <path d="M828 296 l-6 -20"/><path d="M855 292 l10 17"/><path d="M884 290 l-7 -21"/><path d="M911 290 l10 18"/>
    <path d="M936 291 l-7 -20"/><path d="M947 292 l14 -16"/>
  </g>
  <g>
    <circle cx="709" cy="315" r="4" class="bud2"/><circle cx="752" cy="337" r="5" class="bud3"/><circle cx="764" cy="290" r="6" class="bud4"/>
    <circle cx="809" cy="320" r="4" class="bud2"/><circle cx="822" cy="276" r="7" class="bud5"/><circle cx="865" cy="309" r="6" class="bud4"/>
    <circle cx="877" cy="269" r="7" class="bud5"/><circle cx="921" cy="308" r="5" class="bud3"/><circle cx="929" cy="271" r="6" class="bud4"/>
    <circle cx="961" cy="276" r="7" class="bud5"/>
  </g>

  <g class="mono" text-anchor="middle"><text x="620" y="225" class="canopy-label" fill="#9bb8aa">TOTAL CONTRIBUTIONS</text><text x="620" y="282" class="canopy-value" fill="#f3f7fa">503</text><text x="620" y="304" class="tiny" fill="#7f9a8d">LIVE GENERATOR WILL EXPAND THIS TO ONE BRANCH PER CONTRIBUTION YEAR</text></g>

  <g fill="none" stroke-linecap="round"><path d="M620 548 C574 548 532 555 494 571 C465 583 439 588 408 588" stroke="#7ca8b8" stroke-width="5.2"/><path d="M620 548 C666 548 708 555 746 571 C775 583 801 588 832 588" stroke="#91b98f" stroke-width="5.2"/></g>
  <g class="mono"><rect x="286" y="562" width="214" height="52" rx="9" fill="#171d27" stroke="#354154"/><text x="305" y="584" class="root-title" fill="#9ccfd8">MIND</text><text x="305" y="602" class="root-sub" fill="#718096">notes · plans · knowledge</text><rect x="740" y="562" width="214" height="52" rx="9" fill="#171d27" stroke="#354154"/><text x="759" y="584" class="root-title" fill="#a6e3a1">WORK</text><text x="759" y="602" class="root-sub" fill="#718096">code · repos · shipping</text></g>

  <circle r="6" fill="#fff" filter="url(#glow)"><animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#orbPath"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.08;.9;1" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="961" cy="276" r="10" fill="none" stroke="#fff" opacity=".3"><animate attributeName="r" values="8;14;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;.5;.15" dur="2.2s" repeatCount="indefinite"/></circle>

  <rect x="28" y="646" width="1184" height="80" rx="12" fill="#151b24" stroke="#2b3442" stroke-width="1.5"/>
  <g class="mono"><g transform="translate(52 671)"><text class="stat-label" fill="#6f7e91">AUTHORED COMMITS</text><text y="29" class="stat-value" fill="#f1f5f9">467</text></g><g transform="translate(390 671)"><text class="stat-label" fill="#6f7e91">LATEST RENDERED DAY</text><text y="29" class="stat-value" fill="#f1f5f9">SEP 26, 2026</text></g><g transform="translate(815 671)"><text class="stat-label" fill="#6f7e91">LATEST DAY COUNT</text><text y="29" class="stat-value" fill="#f1f5f9">29</text></g></g>
</svg>
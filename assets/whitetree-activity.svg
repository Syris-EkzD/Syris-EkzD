<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">WhiteTree Activity Core</title>
  <desc id="desc">WhiteTree maps the year as a tree: each month is a major branch, each week a sub-branch, and each active commit day a twig whose bud size reflects authored commit intensity. Mind and Work form the roots. A statistics strip summarizes 2026 activity from connected repositories.</desc>

  <defs>
    <style><![CDATA[
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: 1.5px; }
      .sub { font-size: 12px; letter-spacing: 2px; }
      .month-label { font-size: 10px; font-weight: 800; letter-spacing: 1px; fill: #657386; }
      .root-title { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; }
      .root-sub { font-size: 10px; letter-spacing: .2px; }
      .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1.25px; }
      .stat-value { font-size: 23px; font-weight: 800; }
      .tiny { font-size: 9px; letter-spacing: .55px; }
      .month-branch { fill: none; stroke: #d9e0e8; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .week-branch { fill: none; stroke: #7e8b9d; stroke-width: 2.1; stroke-linecap: round; }
      .day-twig { fill: none; stroke: #b7c2cf; stroke-width: 1.65; stroke-linecap: round; }
      .bud1 { fill: #53677b; }
      .bud2 { fill: #7393a5; }
      .bud3 { fill: #91bdc5; }
      .bud4 { fill: #b8e1d1; }
      .bud5 { fill: #f3f7fa; }
    ]]></style>

    <filter id="glow" x="-220%" y="-220%" width="440%" height="440%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6f8096"/>
      <stop offset=".55" stop-color="#c5ced8"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>

    <path id="pulsePath" d="M620 532 C620 482 621 432 620 382 C620 338 621 296 624 252 C629 217 652 190 688 176 C758 148 846 170 930 215"/>
  </defs>

  <rect width="1240" height="760" rx="18" fill="#11151d"/>
  <rect x="10" y="10" width="1220" height="740" rx="14" fill="none" stroke="#2b3442" stroke-width="2"/>

  <!-- header -->
  <text x="40" y="50" class="mono title" fill="#f1f5f9">WHITETREE // ACTIVITY CORE</text>
  <text x="42" y="75" class="mono sub" fill="#718096">MONTH → BRANCH   WEEK → SUB-BRANCH   ACTIVE DAY → TWIG</text>


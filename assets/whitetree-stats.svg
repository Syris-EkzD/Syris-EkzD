<svg xmlns="http://www.w3.org/2000/svg" width="990" height="270" viewBox="0 0 495 135" role="img" aria-labelledby="title desc">
<title id="title">WhiteTree contribution statistics</title>
<desc id="desc">GitHub contributions in the last year through 2026-10-23: 715 contributions, 3-day current streak, 8-day longest streak. Subtle vines frame an animated statistics panel.</desc>
<defs>
<style>
text { font-family: "Trebuchet MS", "DejaVu Sans", sans-serif; }
.panel { fill:#0d1117; stroke:#3a454a; stroke-width:.65; }
.divider { stroke:#37434a; stroke-width:.7; }
.value { fill:#eef4f1; font-size:23px; font-weight:600; text-anchor:middle; }
.label { fill:#c7d1d2; font-size:9.2px; text-anchor:middle; }
.range { fill:#8d9da4; font-size:7.5px; text-anchor:middle; }
.center-label { fill:#e1e9e5; font-size:9.2px; font-weight:600; text-anchor:middle; }
.vine { stroke:#b7c6bf; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.offshoot { stroke:#90a49b; stroke-width:.6; fill:none; stroke-linecap:round; }
.leaf { fill:#e8efec; }
.leaf-renew { transform-box:fill-box; transform-origin:center; animation:leaf-renew 15s ease-in-out infinite; }
.leaf-renew-right { animation-duration:19s; animation-delay:-9s; }
.stone { stroke:#63716f; stroke-width:.5; stroke-linecap:round; fill:none; opacity:.45; }
.delayed { opacity:0; animation:fade-up .45s ease-out forwards; }
.grow { stroke-dasharray:100; stroke-dashoffset:100; animation:draw .8s ease-out forwards; }
.d0 { animation-delay:.10s; } .d1 { animation-delay:.35s; }
.d2 { animation-delay:.48s; } .d3 { animation-delay:.62s; }
.d4 { animation-delay:.78s; } .d5 { animation-delay:.94s; }
.d6 { animation-delay:1.10s; } .d7 { animation-delay:1.20s; }
.d8 { animation-delay:1.32s; }
.streak { transform-box:fill-box; transform-origin:center; animation:streak-in .62s cubic-bezier(.18,.9,.32,1) both; animation-delay:.55s; }
@keyframes fade-up { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes streak-in { from { opacity:0; transform:scale(.86); } 75% { opacity:1; transform:scale(1.05); } to { opacity:1; transform:scale(1); } }
/* A single leaf drifts away, disappears, and quietly grows back. */
@keyframes leaf-renew {
  0%,26%,100% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
  39% { opacity:0; transform:translate(3px,5px) rotate(12deg) scale(.92); }
  45% { opacity:0; transform:translate(0,-1px) rotate(0deg) scale(.78); }
  60% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
}
@media (prefers-reduced-motion:reduce) { .delayed,.grow,.streak,.leaf-renew { animation:none!important; opacity:1!important; stroke-dashoffset:0!important; transform:none!important; } }
</style>
</defs>
<rect width="495" height="135" fill="#0d1117"/>
<rect class="panel" x="17" y="13.75" rx="8" width="461" height="107.5"/>
<path class="divider" d="M171 27V108 M324 27V108"/>
<path class="stone" d="M51 13.75l3 3-1 3 M464 13.75l-2 4 2 3 M17 102l3-2 2 3"/>
<g class="vine">
<path class="grow d0" pathLength="100" d="M17 40 Q15 26 25 18 Q32 13.75 45 13.75"/>
<path class="grow d0" pathLength="100" d="M478 94 Q479 108 467 116 Q457 121.25 446 121.25"/>
</g>
<g class="offshoot">
<path d="M23 20 Q26 23 30 20 M36 14.75 Q37 17.75 41 18.75 M469 116 Q465 112 460 113 M452 121 Q450 117 446 116"/>
</g>
<g class="leaf">
<path d="M30 20 Q31 15 36 16 Q34 21 30 20Z"/>
<path class="leaf-renew" d="M41 18.75 Q42 14.75 46 14.75 Q45 19.75 41 18.75Z"/>
<path d="M460 113 Q461 109 465 109 Q464 114 460 113Z"/>
<path class="leaf-renew leaf-renew-right" d="M446 116 Q441 116 440 111 Q445 112 446 116Z"/>
</g>
<g class="delayed d2"><text id="stat-total" class="value" x="94" y="67.5">715</text></g>
<g class="delayed d3"><text class="label" x="94" y="87.5">Total Contributions</text></g>
<g class="delayed d4"><text id="stat-total-range" class="range" x="94" y="101.5">Last 12 months</text></g>
<g class="delayed d1">
<circle cx="247.5" cy="59.5" r="29" fill="none" stroke="#cad7d0" stroke-width="1.4"/>
<path d="M247.5 30.5 Q241 25.5 245 21.5 Q250 24.5 247.5 30.5Z" fill="#e8efec"/>
<path d="M247.5 30.5 Q254 25.5 250 21.5 Q246 24.5 247.5 30.5Z" fill="#a8bdb3"/>
</g>
<text id="stat-current" class="value streak" x="247.5" y="67.5">3</text>
<g class="delayed d5"><text class="center-label" x="247.5" y="101.5">Current Streak</text></g>
<g class="delayed d6"><text id="stat-current-range" class="range" x="247.5" y="113.5">Oct 21 – Oct 23</text></g>
<g class="delayed d6"><text id="stat-longest" class="value" x="401" y="67.5">8</text></g>
<g class="delayed d7"><text class="label" x="401" y="87.5">Longest Streak</text></g>
<g class="delayed d8"><text id="stat-longest-range" class="range" x="401" y="101.5">Sep 12 – Sep 19</text></g>
</svg>
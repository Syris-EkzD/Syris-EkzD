<svg xmlns="http://www.w3.org/2000/svg" width="990" height="175" viewBox="0 0 495 87.5" role="img" aria-labelledby="title desc">
<title id="title">WhiteTree contribution statistics</title>
<desc id="desc">GitHub contributions in the last year through 2026-10-23: 715 contributions, 3-day current streak, 8-day longest streak. Subtle vines frame an animated statistics panel.</desc>
<defs>
<style>
text { font-family: "Trebuchet MS", "DejaVu Sans", sans-serif; }
.panel { fill:#0d1117; stroke:#3a454a; stroke-width:.65; }
.divider { stroke:#37434a; stroke-width:.7; }
.value { fill:#eef4f1; font-size:23px; font-weight:600; text-anchor:middle; }
.label { fill:#c7d1d2; font-size:9.2px; text-anchor:middle; }
.range { fill:#8d9da4; font-size:7.5px; text-anchor:middle; }
.center-label { fill:#e1e9e5; font-size:9.2px; font-weight:600; text-anchor:middle; }
.vine { stroke:#b7c6bf; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.offshoot { stroke:#90a49b; stroke-width:.6; fill:none; stroke-linecap:round; }
.leaf { fill:#e8efec; }
.stone { stroke:#63716f; stroke-width:.5; stroke-linecap:round; fill:none; opacity:.45; }
.delayed { opacity:0; animation:fade-up .45s ease-out forwards; }
.grow { stroke-dasharray:100; stroke-dashoffset:100; animation:draw .8s ease-out forwards; }
.d0 { animation-delay:.10s; } .d1 { animation-delay:.35s; }
.d2 { animation-delay:.48s; } .d3 { animation-delay:.62s; }
.d4 { animation-delay:.78s; } .d5 { animation-delay:.94s; }
.d6 { animation-delay:1.10s; } .d7 { animation-delay:1.20s; }
.d8 { animation-delay:1.32s; }
.streak { transform-box:fill-box; transform-origin:center; animation:streak-in .62s cubic-bezier(.18,.9,.32,1) both; animation-delay:.55s; }
@keyframes fade-up { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes streak-in { from { opacity:0; transform:scale(.86); } 75% { opacity:1; transform:scale(1.05); } to { opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion:reduce) { .delayed,.grow,.streak { animation:none!important; opacity:1!important; stroke-dashoffset:0!important; transform:none!important; } }
</style>
</defs>
<rect width="495" height="87.5" fill="#0d1117"/>
<rect class="panel" x="4" y="4" rx="7" width="487" height="79.5"/>
<path class="divider" d="M165 14V73 M330 14V73"/>
<path class="stone" d="M41 4l3 3-1 3 M476 4l-2 4 2 3 M4 71l3-2 2 3"/>
<g class="vine">
<path class="grow d0" pathLength="100" d="M4 28 Q2 14 12 8 Q19 4 32 4"/>
<path class="grow d0" pathLength="100" d="M491 60 Q492 75 479 80 Q470 84 459 84"/>
</g>
<g class="offshoot">
<path d="M10 10 Q13 13 17 10 M23 5 Q24 8 28 9 M481 80 Q477 76 472 77 M465 84 Q463 80 459 79"/>
</g>
<g class="leaf">
<path d="M17 10 Q18 5 23 6 Q21 11 17 10Z"/>
<path d="M28 9 Q29 5 33 5 Q32 10 28 9Z"/>
<path d="M472 77 Q473 73 477 73 Q476 78 472 77Z"/>
<path d="M459 79 Q454 79 453 74 Q458 75 459 79Z"/>
</g>
<g class="delayed d2"><text id="stat-total" class="value" x="82.5" y="43">715</text></g>
<g class="delayed d3"><text class="label" x="82.5" y="62">Total Contributions</text></g>
<g class="delayed d4"><text id="stat-total-range" class="range" x="82.5" y="75">Last 12 months</text></g>
<g class="delayed d1">
<circle cx="247.5" cy="36" r="26" fill="none" stroke="#cad7d0" stroke-width="1.4"/>
<path d="M247.5 10 Q241 5 245 1 Q250 4 247.5 10Z" fill="#e8efec"/>
<path d="M247.5 10 Q254 5 250 1 Q246 4 247.5 10Z" fill="#a8bdb3"/>
</g>
<text id="stat-current" class="value streak" x="247.5" y="44">3</text>
<g class="delayed d5"><text class="center-label" x="247.5" y="69">Current Streak</text></g>
<g class="delayed d6"><text id="stat-current-range" class="range" x="247.5" y="79">Oct 21 – Oct 23</text></g>
<g class="delayed d6"><text id="stat-longest" class="value" x="412.5" y="43">8</text></g>
<g class="delayed d7"><text class="label" x="412.5" y="62">Longest Streak</text></g>
<g class="delayed d8"><text id="stat-longest-range" class="range" x="412.5" y="75">Sep 12 – Sep 19</text></g>
</svg>
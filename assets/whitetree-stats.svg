<svg xmlns="http://www.w3.org/2000/svg" width="990" height="230" viewBox="0 0 495 115" role="img" aria-labelledby="title desc">
<title id="title">WhiteTree contribution statistics</title>
<desc id="desc">GitHub contributions in the last year through 2026-10-23: 715 contributions, 3-day current streak, 8-day longest streak. Subtle vines frame an animated statistics panel.</desc>
<defs>
<style>
text { font-family: "Trebuchet MS", "DejaVu Sans", sans-serif; }
.panel { fill:#0d1117; stroke:#3a454a; stroke-width:.65; }
.divider { stroke:#37434a; stroke-width:.7; }
.value { fill:#eef4f1; font-size:23px; font-weight:600; text-anchor:middle; }
.label { fill:#c7d1d2; font-size:9.2px; text-anchor:middle; }
.range { fill:#8d9da4; font-size:7.5px; text-anchor:middle; }
.center-label { fill:#e1e9e5; font-size:9.2px; font-weight:600; text-anchor:middle; }
.vine { stroke:#b7c6bf; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.offshoot { stroke:#90a49b; stroke-width:.6; fill:none; stroke-linecap:round; }
.leaf { fill:#e8efec; }
.stone { stroke:#63716f; stroke-width:.5; stroke-linecap:round; fill:none; opacity:.45; }
.delayed { opacity:0; animation:fade-up .45s ease-out forwards; }
.grow { stroke-dasharray:100; stroke-dashoffset:100; animation:draw .8s ease-out forwards; }
.d0 { animation-delay:.10s; } .d1 { animation-delay:.35s; }
.d2 { animation-delay:.48s; } .d3 { animation-delay:.62s; }
.d4 { animation-delay:.78s; } .d5 { animation-delay:.94s; }
.d6 { animation-delay:1.10s; } .d7 { animation-delay:1.20s; }
.d8 { animation-delay:1.32s; }
.streak { transform-box:fill-box; transform-origin:center; animation:streak-in .62s cubic-bezier(.18,.9,.32,1) both; animation-delay:.55s; }
@keyframes fade-up { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes streak-in { from { opacity:0; transform:scale(.86); } 75% { opacity:1; transform:scale(1.05); } to { opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion:reduce) { .delayed,.grow,.streak { animation:none!important; opacity:1!important; stroke-dashoffset:0!important; transform:none!important; } }
</style>
</defs>
<rect width="495" height="115" fill="#0d1117"/>
<rect class="panel" x="32" y="17.75" rx="7" width="431" height="79.5"/>
<path class="divider" d="M175 27.75V86.75 M320 27.75V86.75"/>
<path class="stone" d="M65 17.75l3 3-1 3 M449 17.75l-2 4 2 3 M32 84.75l3-2 2 3"/>
<g class="vine">
<path class="grow d0" pathLength="100" d="M32 41 Q30 27 40 21 Q47 17.75 60 17.75"/>
<path class="grow d0" pathLength="100" d="M463 73 Q464 88 451 93 Q442 97.25 431 97.25"/>
</g>
<g class="offshoot">
<path d="M38 23.75 Q41 26.75 45 23.75 M51 18.75 Q52 21.75 56 22.75 M453 93.25 Q449 89.25 444 90.25 M437 97.25 Q435 93.25 431 92.25"/>
</g>
<g class="leaf">
<path d="M45 23.75 Q46 18.75 51 19.75 Q49 24.75 45 23.75Z"/>
<path d="M56 22.75 Q57 18.75 61 18.75 Q60 23.75 56 22.75Z"/>
<path d="M444 90.25 Q445 86.25 449 86.25 Q448 91.25 444 90.25Z"/>
<path d="M431 92.25 Q426 92.25 425 87.25 Q430 88.25 431 92.25Z"/>
</g>
<g class="delayed d2"><text id="stat-total" class="value" x="103" y="56.5">715</text></g>
<g class="delayed d3"><text class="label" x="103" y="75.5">Total Contributions</text></g>
<g class="delayed d4"><text id="stat-total-range" class="range" x="103" y="88.5">Last 12 months</text></g>
<g class="delayed d1">
<circle cx="247.5" cy="49.5" r="26" fill="none" stroke="#cad7d0" stroke-width="1.4"/>
<path d="M247.5 23.5 Q241 18.5 245 14.5 Q250 17.5 247.5 23.5Z" fill="#e8efec"/>
<path d="M247.5 23.5 Q254 18.5 250 14.5 Q246 17.5 247.5 23.5Z" fill="#a8bdb3"/>
</g>
<text id="stat-current" class="value streak" x="247.5" y="57.5">3</text>
<g class="delayed d5"><text class="center-label" x="247.5" y="82.5">Current Streak</text></g>
<g class="delayed d6"><text id="stat-current-range" class="range" x="247.5" y="92.5">Oct 21 – Oct 23</text></g>
<g class="delayed d6"><text id="stat-longest" class="value" x="392" y="56.5">8</text></g>
<g class="delayed d7"><text class="label" x="392" y="75.5">Longest Streak</text></g>
<g class="delayed d8"><text id="stat-longest-range" class="range" x="392" y="88.5">Sep 12 – Sep 19</text></g>
</svg>
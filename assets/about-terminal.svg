<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">EkzD's ASCII portrait terminal introduction</title>
  <desc id="desc">An animated neofetch-inspired terminal. The ekzdfetch command types out, revealing an ASCII portrait of EkzD beside profile, development, and interests information.</desc>
  <defs>
    <style><![CDATA[
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, Menlo, monospace; }
      .prompt { font-size: 22px; font-weight: 600; }
      .portrait { font-size: 14px; font-weight: 700; }
      .info { font-size: 15px; }
    ]]></style>
    <clipPath id="command-typing"><rect x="250" y="12" width="0" height="38">
      <animate attributeName="width" values="0;13;26;39;52;65;78;91;104;117" keyTimes="0;0.111;0.222;0.333;0.444;0.555;0.666;0.777;0.888;1" calcMode="discrete" dur="1.7s" begin="0.35s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <rect width="1240" height="720" rx="14" fill="#1a1821"/>
  <text x="20" y="40" class="mono prompt"><tspan fill="#b4befe">ekzd</tspan><tspan fill="#89dceb">@github</tspan><tspan fill="#cdd6f4">:~$</tspan></text>
  <text x="250" y="40" class="mono prompt" fill="#cdd6f4" clip-path="url(#command-typing)">ekzdfetch</text>
  <g opacity="1">
    <animate attributeName="opacity" from="1" to="0" dur=".01s" begin="2.15s" fill="freeze"/>
    <rect x="250" y="15" width="12" height="28" fill="#cdd6f4">
      <animate attributeName="x" values="250;263;276;289;302;315;328;341;354;367" keyTimes="0;0.111;0.222;0.333;0.444;0.555;0.666;0.777;0.888;1" calcMode="discrete" dur="1.7s" begin="0.35s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="2.15s" fill="freeze"/>
    <!-- Background-free ASCII portrait rebuilt from the supplied photo using subject isolation, contrast enhancement, and corrected character aspect ratio. The original photo is not embedded in the repository. -->

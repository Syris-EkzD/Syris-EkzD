    </rect></clipPath>
  </defs>
  <rect width="1240" height="720" rx="14" fill="#1a1821"/>
  <text x="20" y="40" class="mono prompt"><tspan fill="#b4befe">ekzd</tspan><tspan fill="#89dceb">@github</tspan><tspan fill="#cdd6f4">:~$</tspan></text>
  <text x="250" y="40" class="mono prompt" fill="#cdd6f4" clip-path="url(#command-typing)">ekzdfetch</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">EkzD's ASCII portrait terminal introduction</title>
  <desc id="desc">An animated neofetch-inspired terminal. The ekzdfetch command types out, revealing an ASCII portrait of EkzD beside profile, development, and interests information.</desc>
  <defs>
    <style><![CDATA[
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, Menlo, monospace; }
      .prompt { font-size: 22px; font-weight: 600; }
      .portrait { font-size: 10px; font-weight: 600; }
      .info { font-size: 15px; }
    ]]></style>
    <clipPath id="command-typing"><rect x="250" y="12" width="0" height="38">
